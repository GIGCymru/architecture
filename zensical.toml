# Markdown extensions at project level
[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
check_paths = true
auto_append = ["includes/abbreviations.md"]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  {name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format"}
]

# Theme configuration
[project.theme]
custom_dir = "overrides"
logo = "assets/logo.png"
favicon = "assets/favicon.ico"

# Theme features - must be at theme level, not nested
features = [
  "navigation.tabs",
  "navigation.footer",
  "navigation.path",
  "navigation.instant",
  "navigation.top",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "search.highlight"
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Rubik"

# Analytics preferences
[project.extra.consent]
title = "Analytics"
description = """
We use Simple Analytics, a privacy-first service that does not use
cookies or collect personal data, to understand how this architecture
site is used and to improve it. It is on by default. You can opt out below.
"""

# Cookie consent cookies - using dict format to avoid 'list' error
[project.extra.consent.cookies]
analytics = {name = "Simple Analytics (cookieless)", checked = true}

# Analytics configuration
[project.extra.analytics]
provider = "simple"
